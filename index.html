<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="fgdlogo.jpg">
    <title>Fighting Game Dojo - Guilty Gear Strive Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1b3d 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.9);
        }

        .summary {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .summary-card h3 {
            font-size: 2em;
            color: #ff6b6b;
            margin-bottom: 5px;
        }

        .summary-card p {
            color: #b0b0b0;
            font-size: 0.9em;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .section h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #ff6b6b;
            border-bottom: 2px solid rgba(255, 107, 107, 0.3);
            padding-bottom: 10px;
        }

        .fun-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .fun-stat-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .fun-stat-card h3 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #ffa726;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fun-stat-card .icon {
            font-size: 1.5em;
        }

        .fun-stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            transition: all 0.3s;
        }

        .fun-stat-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .fun-stat-item .rank {
            font-weight: bold;
            color: #ffa726;
            min-width: 30px;
        }

        .fun-stat-item .name {
            flex: 1;
            font-weight: 500;
        }

        .fun-stat-item .value {
            font-weight: bold;
            color: #66bb6a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: rgba(255, 107, 107, 0.2);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #ffa726;
            border-bottom: 2px solid rgba(255, 107, 107, 0.3);
        }

        th.center {
            text-align: center;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        td.center {
            text-align: center;
        }

        tbody tr {
            transition: all 0.3s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .player-name {
            font-weight: 500;
            color: #e0e0e0;
        }

        .win-rate {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
        }

        .win-rate.high {
            background: rgba(102, 187, 106, 0.3);
            color: #66bb6a;
        }

        .win-rate.medium {
            background: rgba(255, 167, 38, 0.3);
            color: #ffa726;
        }

        .win-rate.low {
            background: rgba(239, 83, 80, 0.3);
            color: #ef5350;
        }

        .tournaments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .tournament-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
        }

        .tournament-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .tournament-date {
            font-size: 0.9em;
            color: #ffa726;
            margin-bottom: 5px;
        }

        .tournament-name {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        .tournament-winner {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls {
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .controls label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #ffa726;
        }

        .selector select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e0e0e0;
            padding: 10px 14px;
            border-radius: 8px;
            min-width: 220px;
            font-size: 1em;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #66bb6a 0%, #4caf50 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .refresh-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .last-updated {
            font-size: 0.85em;
            color: #b0b0b0;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .fun-stats-grid {
                grid-template-columns: 1fr;
            }

            .tournaments-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 8px 10px;
            }
        }

        @media (max-width: 640px) {
            /* Keep only player, tournaments, and win rate visible on phones */
            .col-rank,
            .col-games-won,
            .col-games-lost,
            .col-first-place {
                display: none;
            }

            table {
                font-size: 0.85em;
                table-layout: fixed;
            }

            th, td {
                padding: 6px 4px;
            }

            th {
                font-size: 0.8em;
            }

            .player-col {
                width: 55%;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .col-tournaments {
                width: 20%;
                white-space: nowrap;
            }

            .col-win-rate {
                width: 25%;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Fighting Game Dojo</h1>
            <div class="subtitle">Guilty Gear Strive Leaderboard</div>
        </header>

        <div id="content">
            <div class="loading">Loading leaderboard data...</div>
        </div>
    </div>

    <script>
        // Detect available seasons by trying to load them
        async function detectAvailableSeasons() {
            const seasons = [];
            for (let i = 0; i < 10; i++) {
                try {
                    const response = await fetch(`leaderboard-season-${i}.json`, { method: 'HEAD' });
                    if (response.ok) {
                        seasons.push(String(i));
                    }
                } catch (e) {
                    // Season file doesn't exist, stop checking
                    break;
                }
            }
            return seasons.length > 0 ? seasons : ['0'];
        }

        async function loadLeaderboard() {
            try {
                // Detect available seasons
                window.availableSeasons = await detectAvailableSeasons();
                
                // Get selected season from localStorage or default to latest season
                const storedSeason = localStorage.getItem('fgdojo:selectedSeason');
                const latestSeason = window.availableSeasons[window.availableSeasons.length - 1];
                window.currentSeason = (storedSeason && window.availableSeasons.includes(storedSeason)) 
                    ? storedSeason 
                    : latestSeason;

                const seasonFile = `leaderboard-season-${window.currentSeason}.json`;
                const response = await fetch(seasonFile + '?v=' + new Date().getTime());
                if (!response.ok) throw new Error(`Failed to load ${seasonFile}`);

                const data = await response.json();
                displayLeaderboard(data);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ❌ Error loading leaderboard: ${error.message}
                        <br><br>
                        Make sure at least leaderboard-season-0.json exists in the same directory.
                    </div>
                `;
            }
        }

        function getWinRateClass(winRate) {
            const rate = parseFloat(winRate);
            if (rate >= 60) return 'high';
            if (rate >= 45) return 'medium';
            return 'low';
        }

        function sortPlayers(players) {
            return [...players].sort((a, b) => {
                if (b.winRateNum !== a.winRateNum) return b.winRateNum - a.winRateNum;
                if (b.gamesWon !== a.gamesWon) return b.gamesWon - a.gamesWon;
                if (b.tournamentsAttended !== a.tournamentsAttended) return b.tournamentsAttended - a.tournamentsAttended;
                return b.firstPlaces - a.firstPlaces;
            });
        }

        function displayLeaderboard(data) {
            const content = document.getElementById('content');
            const subtitle = document.querySelector('.subtitle');
            const games = (data.games && data.games.length)
                ? data.games
                : [{ gameId: 'all', gameName: 'All Games', players: data.players ?? [], tournaments: data.tournaments ?? [] }];

            // Use string keys so selector values match map lookups
            const gameMap = new Map(games.map(g => [String(g.gameId), g]));
            const storedGameId = localStorage.getItem('fgdojo:selectedGameId');
            let selectedGameId = storedGameId && gameMap.has(storedGameId)
                ? storedGameId
                : (games[0]?.gameId != null ? String(games[0].gameId) : 'all');

            const getGameFunStats = (players) => {
                if (!players || players.length === 0) return { mostFirstPlaces: [], highestWinRate: [], mostTournamentsAttended: [] };
                
                const sorted = [...players];
                return {
                    mostFirstPlaces: sorted.sort((a, b) => b.firstPlaces - a.firstPlaces).slice(0, 5).map(p => ({
                        displayName: p.displayName,
                        firstPlaces: p.firstPlaces,
                        tournamentsAttended: p.tournamentsAttended,
                    })),
                    highestWinRate: sorted.filter(p => p.gamesWon + p.gamesLost >= 10).sort((a, b) => b.winRateNum - a.winRateNum).slice(0, 5).map(p => ({
                        displayName: p.displayName,
                        winRate: `${p.winRate}%`,
                        gamesWon: p.gamesWon,
                        gamesLost: p.gamesLost,
                    })),
                    mostTournamentsAttended: sorted.sort((a, b) => b.tournamentsAttended - a.tournamentsAttended).slice(0, 5).map(p => ({
                        displayName: p.displayName,
                        tournamentsAttended: p.tournamentsAttended,
                        firstPlaces: p.firstPlaces,
                    })),
                };
            };

            const render = () => {
                const currentGame = gameMap.get(String(selectedGameId)) ?? games[0];
                // Use the game's own players and tournaments, not the global ones
                const players = sortPlayers(currentGame?.players ?? []);
                const tournaments = currentGame?.tournaments ?? [];
                const gameName = currentGame?.gameName ?? 'All Games';
                const funStats = getGameFunStats(players);

                // Persist last selected game for user-friendly refresh
                localStorage.setItem('fgdojo:selectedGameId', String(selectedGameId));

                if (subtitle) {
                    subtitle.textContent = `${gameName} Leaderboard`;
                }

                content.innerHTML = `
                    <div class="controls">
                        <div>
                            <label for="season-selector">Season</label>
                            <div class="selector">
                                <select id="season-selector">
                                    ${window.availableSeasons.map(s => `<option value="${s}" ${s === window.currentSeason ? 'selected' : ''}>Season ${s}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <div>
                            <label for="game-selector">Game</label>
                            <div class="selector">
                                <select id="game-selector">
                                    ${games.map(g => `<option value="${String(g.gameId)}" ${String(g.gameId) === selectedGameId ? 'selected' : ''}>${g.gameName}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <button id="refresh-btn" class="refresh-btn">🔄 Refresh</button>
                    </div>

                    <div class="summary">
                        <div class="summary-card">
                            <h3>${players.length}</h3>
                            <p>Total Players</p>
                        </div>
                        <div class="summary-card">
                            <h3>${tournaments.length}</h3>
                            <p>Total Tournaments</p>
                        </div>
                    </div>

                    <div class="section">
                        <h2>🏆 Fun Stats</h2>
                        <div class="fun-stats-grid">
                            <div class="fun-stat-card">
                                <h3><span class="icon">👑</span> Most 1st Places</h3>
                                ${funStats.mostFirstPlaces.map((p, i) => `
                                    <div class="fun-stat-item">
                                        <span class="rank">#${i + 1}</span>
                                        <span class="name">${p.displayName}</span>
                                        <span class="value">${p.firstPlaces} wins</span>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="fun-stat-card">
                                <h3><span class="icon">📈</span> Highest Win Rate</h3>
                                ${funStats.highestWinRate.map((p, i) => `
                                    <div class="fun-stat-item">
                                        <span class="rank">#${i + 1}</span>
                                        <span class="name">${p.displayName}</span>
                                        <span class="value">${p.winRate}</span>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="fun-stat-card">
                                <h3><span class="icon">🎯</span> Most Tournaments</h3>
                                ${funStats.mostTournamentsAttended.map((p, i) => `
                                    <div class="fun-stat-item">
                                        <span class="rank">#${i + 1}</span>
                                        <span class="name">${p.displayName}</span>
                                        <span class="value">${p.tournamentsAttended} events</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <h2>📊 Player Leaderboard</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th class="center col-rank">#</th>
                                    <th class="player-col">Player</th>
                                    <th class="center col-tournaments">Events</th>
                                    <th class="center col-games-won">Games Won</th>
                                    <th class="center col-games-lost">Games Lost</th>
                                    <th class="center col-win-rate">Win%</th>
                                    <th class="center col-first-place">1st Places</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${players.map((player, index) => `
                                    <tr>
                                        <td class="center col-rank">${index + 1}</td>
                                        <td class="player-name player-col">${player.displayName}</td>
                                        <td class="center col-tournaments">${player.tournamentsAttended}</td>
                                        <td class="center col-games-won">${player.gamesWon}</td>
                                        <td class="center col-games-lost">${player.gamesLost}</td>
                                        <td class="center col-win-rate">
                                            <span class="win-rate ${getWinRateClass(player.winRate)}">${player.winRate}%</span>
                                        </td>
                                        <td class="center col-first-place">${player.firstPlaces > 0 ? '🏆 ' + player.firstPlaces : '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div class="section">
                        <h2>📅 Tournament History</h2>
                        <div class="tournaments-grid">
                            ${tournaments.map(tournament => `
                                <div class="tournament-card">
                                    <div class="tournament-date">${tournament.date || 'Date TBD'}</div>
                                    <div class="tournament-name">${tournament.name}</div>
                                    <div class="tournament-winner">
                                        <span class="trophy">🏆</span>
                                        <span class="winner-name">${tournament.winner || 'TBD'}</span>
                                    </div>
                                    <div style="margin-top: 10px; font-size: 0.9em; color: #b0b0b0;">
                                        ${tournament.entrantCount} entrants
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="last-updated">Last updated: ${new Date().toLocaleString()}</div>
                `;

                const seasonSelector = document.getElementById('season-selector');
                const gameSelector = document.getElementById('game-selector');
                const refreshBtn = document.getElementById('refresh-btn');
                
                seasonSelector?.addEventListener('change', (event) => {
                    const newSeason = event.target.value;
                    localStorage.setItem('fgdojo:selectedSeason', newSeason);
                    window.location.reload();
                });

                gameSelector?.addEventListener('change', (event) => {
                    selectedGameId = event.target.value;
                    localStorage.setItem('fgdojo:selectedGameId', String(selectedGameId));
                    render();
                });

                refreshBtn?.addEventListener('click', () => {
                    refreshBtn.classList.add('loading');
                    window.location.reload();
                });
            };

            render();
        }

        // Load data when page loads
        loadLeaderboard();
    </script>
</body>
</html>
