version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # graphql-request (the start.gg client) only supports graphql 14-16; allow graphql 17 once it does.
      - dependency-name: graphql
        update-types: ['version-update:semver-major']
