name: Build and deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'shared/**'
      - 'public/**'
      - 'src/**'
      - 'data/**'
      - 'tests/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  schedule:
    # Results after the dojo: Saturday, Sunday and Monday at 20:00 UTC (dojos are on Saturday or Sunday;
    # Monday catches late result fixes).
    - cron: '0 20 * * 6,0,1'
  workflow_dispatch:

concurrency:
  group: fgdojo-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Restore start.gg response cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/startgg
          key: startgg-${{ github.run_id }}
          restore-keys: startgg-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Refresh data and build site
        run: npm run build
        env:
          STARTGG_KEY: ${{ secrets.STARTGG_KEY }}
          CI: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Deploy HTML without stale caching
        run: aws s3 sync dist s3://fgdojo.stek.world --delete --exclude "*" --include "*.html" --cache-control "no-cache, no-store, must-revalidate"

      # data/next-dojo.json is excluded (never uploaded or deleted here): the next-dojo workflow owns it.
      - name: Deploy data so browsers always revalidate it
        run: aws s3 sync dist s3://fgdojo.stek.world --delete --exclude "*" --include "data/*" --exclude "data/next-dojo.json" --cache-control "no-cache"

      - name: Deploy static assets
        run: aws s3 sync dist s3://fgdojo.stek.world --delete --exclude "*.html" --exclude "data/*" --cache-control "public, max-age=300"
