name: Build and deploy

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'shared/**'
      - 'public/**'
      - 'src/**'
      - 'data/**'
      - 'tests/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  schedule:
    # Refresh start.gg data on Sunday and Monday at 20:00 UTC (tournaments are on weekends).
    - cron: '0 20 * * 0,1'
    # Dojo day: every 30 minutes on Saturdays and Sundays; the gate job below only lets a run through on the
    # dojo day between 13:00 and 23:00 Brussels time (11:00-22:59 UTC covers summer and winter time).
    - cron: '*/30 11-22 * * 0,6'
  workflow_dispatch:

concurrency:
  group: fgdojo-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dojo-day-gate:
    name: Is it dojo time?
    # Only for the dojo-day schedule; pushes, manual runs and the Sun/Mon refresh skip this check.
    if: github.event.schedule == '*/30 11-22 * * 0,6'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      refresh: ${{ steps.gate.outputs.refresh }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Check the live next-dojo.json
        id: gate
        run: node src/cli/results_refresh_gate.js https://fgdojo.stek.world

  build-and-deploy:
    name: Build and deploy to S3
    needs: dojo-day-gate
    # Runs for every trigger except a dojo-day schedule run outside dojo time.
    if: always() && (needs.dojo-day-gate.result == 'skipped' || needs.dojo-day-gate.outputs.refresh == 'true')
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Restore start.gg response cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/startgg
          key: startgg-${{ github.run_id }}
          restore-keys: startgg-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Refresh data and build site
        run: npm run build
        env:
          STARTGG_KEY: ${{ secrets.STARTGG_KEY }}
          CI: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Deploy HTML without stale caching
        run: aws s3 sync dist s3://fgdojo.stek.world --delete --exclude "*" --include "*.html" --cache-control "no-cache, no-store, must-revalidate"

      # data/next-dojo.json is excluded (never uploaded or deleted here): the next-dojo workflow owns it.
      - name: Deploy data so browsers always revalidate it
        run: aws s3 sync dist s3://fgdojo.stek.world --delete --exclude "*" --include "data/*" --exclude "data/next-dojo.json" --cache-control "no-cache"

      - name: Deploy static assets
        run: aws s3 sync dist s3://fgdojo.stek.world --delete --exclude "*.html" --exclude "data/*" --cache-control "public, max-age=300"
