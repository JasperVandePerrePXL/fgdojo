name: Refresh Leaderboard & Deploy to S3

on:
  schedule:
    # Saturdays and Sundays at 21:00 UTC
    - cron: '0 21 * * 6'
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site and data
        run: npm run build
        env:
          STARTGG_KEY: ${{ secrets.STARTGG_KEY }}
          CI: true

      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete --cache-control max-age=300
        env:
          AWS_S3_BUCKET: fgdojo.stek.world
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-3
          SOURCE_DIR: dist
