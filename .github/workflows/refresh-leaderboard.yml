name: Refresh leaderboard

on:
  schedule:
    # Sunday and Monday at 20:00 UTC.
    - cron: '0 20 * * 0'
    - cron: '0 20 * * 1'
  workflow_dispatch:

concurrency:
  group: fgdojo-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh-and-deploy:
    name: Refresh start.gg data and deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore start.gg response cache
        uses: actions/cache@v4
        with:
          path: .cache/startgg
          key: startgg-${{ github.run_id }}
          restore-keys: startgg-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Refresh data and build site
        run: npm run build
        env:
          STARTGG_KEY: ${{ secrets.STARTGG_KEY }}
          CI: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Deploy dist folder to S3
        run: aws s3 sync dist s3://fgdojo.stek.world --delete --cache-control "public, max-age=300"
