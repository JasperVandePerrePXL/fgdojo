name: Refresh Leaderboard (Generate Season Data)

on:
  schedule:
    # Run weekly on Sundays at 10 PM UTC (adjust as needed)
    - cron: '0 21 * * 0'
    - cron: '0 21 * * 6'  # Also run on Saturdays for more frequent updates
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'seasons/**'
      - 'public/index.html'

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate all season data
        env:
          STARTGG_KEY: ${{ secrets.STARTGG_KEY }}
        run: node scripts/process_all_seasons.js

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Auto-refresh season data'
          file_pattern: 'data/output-season-*.json data/leaderboard-season-*.json'
        if: always()
