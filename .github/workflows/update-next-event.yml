name: Update next Fighting Game Dojo event

on:
  schedule:
    # Saturday, Sunday and Monday, one hour after the results refresh (dojos are on Saturday or Sunday), so the
    # next dojo (e.g. December after the November dojo) is added to data/tournament_slugs.json right away.
    - cron: '0 21 * * 6,0,1'
  workflow_dispatch:

concurrency:
  group: fgdojo-next-event
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update-next-event:
    name: Discover and save next tournament
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check hub for the latest Fighting Game Dojo tournament
        run: npm run next-event
        env:
          STARTGG_KEY: ${{ secrets.STARTGG_KEY }}

      - name: Commit and push configuration changes
        run: |
          if git diff --quiet -- data/tournament_slugs.json; then
            echo "No next-event configuration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournament_slugs.json
          git diff --cached --quiet && exit 0
          git commit -m "Update next Fighting Game Dojo event"
          git push origin main
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
