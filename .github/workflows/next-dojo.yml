name: Update next dojo

# Keeps the "Next dojo" card on the rankings page live (one start.gg call per update; the small file is uploaded
# only when it changed). GitHub runs frequent schedules only when it has capacity (often hours apart), so one run
# stays active for about 5 hours: it updates the card every 30 minutes, sleeps in between, and then starts the
# next run itself. The schedule below only restarts the chain if it ever stopped.
# Free: Actions minutes are unlimited for public repositories. Only one run is active at a time (concurrency);
# a run started while another is active waits, and GitHub cancels an older waiting run, so the chain never doubles.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: fgdojo-next-dojo
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to start the next run of this workflow

jobs:
  next-dojo:
    name: Update the next dojo every 30 minutes
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    env:
      ROUNDS: 11 # updates per run (the first right away, then every INTERVAL seconds: about 5 hours)
      INTERVAL: 1800

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Update the card every 30 minutes
        run: .github/scripts/next-dojo-loop.sh
        env:
          STARTGG_KEY: ${{ secrets.STARTGG_KEY }}

      # Also after a failed step, but not when the run was cancelled on purpose.
      - name: Start the next run
        if: ${{ !cancelled() }}
        run: gh workflow run next-dojo.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
